<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سقوط ساز - شت ایده ها</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1 class="logo"> شت ایده ها</h1>
    <nav>
      <a href="index.html">خانه</a>
      <a href="index.html#services">خدمات</a>
      <a href="about.html">درباره ما</a>
      <a href="contact.html">تماس با ما</a>
    </nav>
  </header>

  <h2>حرکت سقوط ساز</h2>

  <section class="saz-stage">
    <p class="saz-label">فریم <span id="sazLabelFrame">۰۰</span> · <bdi dir="ltr" id="sazLabelAngle">۰°</bdi></p>

    <svg viewBox="0 0 760 560" role="img" aria-label="تار روی فرش می‌افتد">
      <defs>
        <pattern id="carpet" width="40" height="24" patternUnits="userSpaceOnUse">
          <rect width="40" height="24" fill="#6e1a1f"/>
          <path d="M20 2 L36 12 L20 22 L4 12 Z" fill="#1d2440"/>
          <path d="M20 7 L28 12 L20 17 L12 12 Z" fill="#b8473d"/>
          <circle cx="20" cy="12" r="1.6" fill="#e9c9a0"/>
          <circle cx="0" cy="0" r="2" fill="#e9c9a0"/>
          <circle cx="40" cy="24" r="2" fill="#e9c9a0"/>
        </pattern>
        <linearGradient id="floorShade" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#000" stop-opacity="0.75"/>
          <stop offset="0.35" stop-color="#000" stop-opacity="0.1"/>
          <stop offset="1" stop-color="#000" stop-opacity="0.35"/>
        </linearGradient>
        <radialGradient id="wood" cx="0.35" cy="0.3" r="0.8">
          <stop offset="0" stop-color="#b8612a"/>
          <stop offset="0.55" stop-color="#6e3014"/>
          <stop offset="1" stop-color="#2e1206"/>
        </radialGradient>
        <radialGradient id="skin" cx="0.4" cy="0.35" r="0.75">
          <stop offset="0" stop-color="#e6cfa4"/>
          <stop offset="1" stop-color="#a88a5e"/>
        </radialGradient>
        <linearGradient id="neck" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#c9a36b"/>
          <stop offset="0.5" stop-color="#ecd3a2"/>
          <stop offset="1" stop-color="#a77d47"/>
        </linearGradient>
      </defs>

      <rect width="760" height="560" fill="#0d0b0a"/>
      <rect y="400" width="760" height="160" fill="url(#carpet)"/>
      <rect y="400" width="760" height="160" fill="url(#floorShade)"/>

      <!-- Shadow follows the bowl; moved together with the instrument in saz.js -->
      <ellipse id="sazShadow" cx="200" cy="482" rx="70" ry="9" fill="#000" opacity="0.55"/>

      <!-- Upright tar; rotated around the centre of the lower bowl (200,420) -->
      <g id="sazInstrument">
        <!-- neck -->
        <rect x="193" y="66" width="14" height="230" rx="3" fill="url(#neck)"/>
        <g stroke="#7a5228" stroke-width="1.4">
          <line x1="193" y1="82" x2="207" y2="82"/>
          <line x1="193" y1="96" x2="207" y2="96"/>
          <line x1="193" y1="110" x2="207" y2="110"/>
          <line x1="193" y1="123" x2="207" y2="123"/>
          <line x1="193" y1="136" x2="207" y2="136"/>
          <line x1="193" y1="148" x2="207" y2="148"/>
          <line x1="193" y1="160" x2="207" y2="160"/>
          <line x1="193" y1="171" x2="207" y2="171"/>
          <line x1="193" y1="182" x2="207" y2="182"/>
          <line x1="193" y1="192" x2="207" y2="192"/>
          <line x1="193" y1="202" x2="207" y2="202"/>
          <line x1="193" y1="211" x2="207" y2="211"/>
          <line x1="193" y1="220" x2="207" y2="220"/>
          <line x1="193" y1="228" x2="207" y2="228"/>
          <line x1="193" y1="236" x2="207" y2="236"/>
          <line x1="193" y1="243" x2="207" y2="243"/>
          <line x1="193" y1="250" x2="207" y2="250"/>
        </g>

        <!-- pegbox and pegs -->
        <g fill="#7b3a17">
          <rect x="194" y="30" width="12" height="40" rx="2"/>
          <rect x="178" y="36" width="16" height="4" rx="2"/>
          <rect x="206" y="44" width="16" height="4" rx="2"/>
          <rect x="178" y="52" width="16" height="4" rx="2"/>
          <rect x="206" y="60" width="16" height="4" rx="2"/>
          <circle cx="176" cy="38" r="6"/>
          <circle cx="224" cy="46" r="6"/>
          <circle cx="176" cy="54" r="6"/>
          <circle cx="224" cy="62" r="6"/>
        </g>

        <!-- body: lower and upper bowls -->
        <circle cx="200" cy="325" r="45" fill="url(#wood)"/>
        <circle cx="200" cy="420" r="60" fill="url(#wood)"/>

        <!-- skin face over both bowls -->
        <path d="M200 286
                 C 172 286 162 312 172 336
                 C 176 346 176 356 168 364
                 C 140 384 140 448 168 466
                 C 184 476 216 476 232 466
                 C 260 448 260 384 232 364
                 C 224 356 224 346 228 336
                 C 238 312 228 286 200 286 Z"
              fill="url(#skin)" stroke="#d9b986" stroke-width="2"/>

        <!-- bridge and tailpiece -->
        <rect x="186" y="440" width="28" height="5" rx="1.5" fill="#f2e2c0"/>
        <rect x="196" y="462" width="8" height="18" rx="2" fill="#e9d6b0"/>

        <!-- strings -->
        <g stroke="#f4ecd8" stroke-width="0.7" opacity="0.9">
          <line x1="197" y1="66" x2="197" y2="472"/>
          <line x1="200" y1="66" x2="200" y2="472"/>
          <line x1="203" y1="66" x2="203" y2="472"/>
        </g>

        <!-- highlight on the lower bowl -->
        <ellipse cx="236" cy="396" rx="7" ry="18" fill="#fff" opacity="0.12" transform="rotate(-25 236 396)"/>
      </g>

      <g id="sazDust" fill="#c9b08a"></g>
    </svg>

    <div class="saz-controls">
      <button type="button" class="hero-button" id="sazPlay">پخش دوباره</button>
      <label class="saz-scrub">
        <span>فریم به فریم</span>
        <input type="range" id="sazFrame" min="0" max="16" step="1" value="0" dir="ltr">
      </label>
    </div>
  </section>

  <footer id="contact">
    <p>ایمیل: info@example.com</p>
    <p>تلفن: ۰۹۱۲xxxxxxx</p>
  </footer>

  <script src="saz.js"></script>
</body>
</html>
