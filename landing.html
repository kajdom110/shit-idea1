       the sticky stage keeps the frame on screen while it plays -->

    <div class="stage">
      <canvas id="sequenceCanvas"></canvas>
    </div>
  </section>

  <!-- Reserved for the sliding showcase of other instruments -->
  <section class="instruments" id="instruments" aria-hidden="true"></section>

  <section class="contact" id="contact">

  </section>
