<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>درخواست‌های ثبت‌شده - شت ایده ها</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1 class="logo"> شت ایده ها</h1>
    <nav>
      <a href="index.html">خانه</a>
      <a href="index.html#services">خدمات</a>
      <a href="about.html">درباره ما</a>
      <a href="contact.html">تماس با ما</a>
    </nav>
  </header>

  <h2>درخواست‌های ثبت‌شده</h2>

  <form class="contact-form" id="loginForm" novalidate>
    <label for="username">نام‌کاربری</label>
    <input type="text" id="username" name="username" autocomplete="username" required>

    <label for="password">رمز عبور</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>

    <button type="submit">ورود</button>
    <p class="form-status" id="loginStatus" role="status"></p>
  </form>

  <p class="admin-status" id="adminStatus"></p>
  <div class="messages" id="messagesList"></div>

  <footer id="contact">
    <p>ایمیل: info@example.com</p>
    <p>تلفن: ۰۹۱۲xxxxxxx</p>
  </footer>

  <script src="admin.js"></script>
</body>
</html>
